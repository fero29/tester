events {
    worker_connections 1024;
}

http {
    upstream flask_app {
        server web:5000;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name photostory.sk;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name photostory.sk;

        ssl_certificate /etc/letsencrypt/live/photostory.sk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/photostory.sk/privkey.pem;

        # Increase upload size limit for AI image import
        client_max_body_size 100M;

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            proxy_connect_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
